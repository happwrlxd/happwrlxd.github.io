<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Feliz aniversário ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #22000c 0%, #0a0005 55%, #000 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    body {
      position: relative;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      background: rgba(0, 0, 0, 0.18);
      transition: opacity 0.8s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .touch-box {
      padding: 18px 28px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 50, 100, 0.12);
      animation: pulseBox 1.7s ease-in-out infinite;
    }

    @keyframes pulseBox {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(255, 50, 100, 0.10);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 40px rgba(255, 50, 100, 0.22);
      }
    }

    .message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      text-align: center;
      color: white;
      opacity: 0;
      transition: opacity 1.5s ease, transform 1.5s ease;
      pointer-events: none;
      width: 90%;
    }

    .message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .message h1 {
      font-size: clamp(30px, 8vw, 52px);
      font-weight: 600;
      line-height: 1.15;
      text-shadow:
        0 0 10px rgba(255, 70, 120, 0.95),
        0 0 24px rgba(255, 40, 95, 0.85),
        0 0 45px rgba(255, 10, 80, 0.55);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="overlay" id="overlay">
    <div class="touch-box">Toque na tela</div>
  </div>

  <div class="message" id="message">
    <h1>Feliz aniversário meu amor ❤️</h1>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");

    let width = 0;
    let height = 0;
    let dpr = 1;

    let animationStarted = false;
    let startedAt = 0;

    let particles = [];
    let fireworks = [];

    // inclinação do celular
    let tiltGamma = 0; // esquerda/direita
    let tiltBeta = 0;  // frente/trás

    let smoothGamma = 0;
    let smoothBeta = 0;

    // rotação manual 360
    let manualSpin = 0;
    let spinVelocity = 0;
    let spinCooldown = false;
    let lastPointerX = null;
    let lastPointerY = null;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (animationStarted) {
        createHeartParticles();
      }
    }

    window.addEventListener("resize", resizeCanvas);

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

      return { x, y };
    }

    class Particle {
      constructor(baseX, baseY) {
        this.homeX = baseX;
        this.homeY = baseY;

        this.x = Math.random() * width;
        this.y = Math.random() * height;

        this.size = Math.random() * 2.2 + 0.8;
        this.speed = Math.random() * 0.05 + 0.02;
        this.alpha = Math.random() * 0.5 + 0.45;
        this.offset = Math.random() * Math.PI * 2;

        this.drawX = this.x;
        this.drawY = this.y;
      }

      update(time, transform) {
        const pulseLocal = 1 + Math.sin(time * 0.002 + this.offset) * 0.018;

        const dx = this.homeX * pulseLocal * transform.scaleX;
        const dy = this.homeY * pulseLocal * transform.scaleY;

        const rotated = rotatePoint(dx, dy, transform.angle);

        const targetX = transform.cx + rotated.x + transform.offsetX;
        const targetY = transform.cy + rotated.y + transform.offsetY;

        this.x += (targetX - this.x) * this.speed;
        this.y += (targetY - this.y) * this.speed;

        const floatX = Math.cos(time * 0.0015 + this.offset) * 0.35;
        const floatY = Math.sin(time * 0.0018 + this.offset) * 0.35;

        this.drawX = this.x + floatX;
        this.drawY = this.y + floatY;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.drawX, this.drawY, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 40, 95, ${this.alpha})`;
        ctx.shadowBlur = 14;
        ctx.shadowColor = "rgba(255, 30, 90, 0.9)";
        ctx.fill();
      }
    }

    class FireworkSpark {
      constructor(x, y) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 1.8 + 0.9;

        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.012;
        this.size = Math.random() * 2 + 1;
        this.alpha = 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.015; // gravidade leve
        this.life -= this.decay;
        this.alpha = Math.max(this.life, 0);
      }

      draw() {
        if (this.life <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 210, 120, ${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(255, 180, 80, 0.9)";
        ctx.fill();
      }
    }

    function createHeartParticles() {
      particles = [];

      const count = width < 600 ? 1000 : 1400;
      const scale = Math.min(width, height) / 42;

      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t);
        const fill = Math.sqrt(Math.random());

        const x = p.x * scale * fill;
        const y = -p.y * scale * fill;

        particles.push(new Particle(x, y));
      }
    }

    function rotatePoint(x, y, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: x * cos - y * sin,
        y: x * sin + y * cos
      };
    }

    function drawBackgroundGlow() {
      const gradient = ctx.createRadialGradient(
        width / 2, height / 2, 0,
        width / 2, height / 2, Math.min(width, height) * 0.55
      );

      gradient.addColorStop(0, "rgba(255, 0, 80, 0.10)");
      gradient.addColorStop(0.45, "rgba(255, 0, 80, 0.03)");
      gradient.addColorStop(1, "rgba(255, 0, 80, 0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function maybeLaunchFirework(time) {
      if (!animationStarted) return;

      // chance baixa pra não pesar
      if (Math.random() < 0.012) {
        const side = Math.random() < 0.5 ? 0.22 : 0.78;
        const x = width * side + (Math.random() * 40 - 20);
        const y = height * (0.18 + Math.random() * 0.18);

        const amount = 10 + Math.floor(Math.random() * 8);
        for (let i = 0; i < amount; i++) {
          fireworks.push(new FireworkSpark(x, y));
        }
      }
    }

    function updateFireworks() {
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.update();
        fw.draw();

        if (fw.life <= 0) {
          fireworks.splice(i, 1);
        }
      }
    }

    function getHeartTransform(time) {
      smoothGamma += (tiltGamma - smoothGamma) * 0.08;
      smoothBeta += (tiltBeta - smoothBeta) * 0.08;

      // inclinação leve
      const tiltAngle = (smoothGamma / 45) * 0.35;

      // pequeno deslocamento acompanhando o aparelho
      const offsetX = (smoothGamma / 45) * 18;
      const offsetY = (smoothBeta / 45) * 10;

      // pseudo inclinação/3d leve
      const scaleX = 1 + Math.abs(smoothGamma / 90) * 0.06;
      const scaleY = 1 - Math.abs(smoothBeta / 90) * 0.04;

      // giro manual 360
      manualSpin += spinVelocity;
      spinVelocity *= 0.965;

      if (Math.abs(spinVelocity) < 0.0003) {
        spinVelocity = 0;
      }

      // pulsação principal
      const mainPulse = 1 + Math.sin((time - startedAt) * 0.0032) * 0.028;

      return {
        cx: width / 2,
        cy: height / 2,
        angle: tiltAngle + manualSpin,
        offsetX,
        offsetY,
        scaleX: scaleX * mainPulse,
        scaleY: scaleY * mainPulse
      };
    }

    function animate(time) {
      ctx.clearRect(0, 0, width, height);
      drawBackgroundGlow();

      if (animationStarted) {
        maybeLaunchFirework(time);

        const transform = getHeartTransform(time);

        for (const particle of particles) {
          particle.update(time, transform);
          particle.draw();
        }

        updateFireworks();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(animate);
    }

    async function requestMotionPermission() {
      try {
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === "granted") {
            window.addEventListener("deviceorientation", handleOrientation);
          }
        } else {
          window.addEventListener("deviceorientation", handleOrientation);
        }
      } catch (err) {
        console.log("Permissão de movimento não concedida:", err);
      }
    }

    function handleOrientation(event) {
      tiltGamma = Math.max(-35, Math.min(35, event.gamma || 0));
      tiltBeta = Math.max(-25, Math.min(25, event.beta ? event.beta - 45 : 0));
    }

    function triggerSpin(direction = 1) {
      if (spinCooldown) return;

      spinCooldown = true;

      // 360 graus suaves
      spinVelocity += 0.28 * direction;

      setTimeout(() => {
        spinCooldown = false;
      }, 700);
    }

    function handlePointerMove(x, y) {
      if (!animationStarted) return;

      if (lastPointerX === null || lastPointerY === null) {
        lastPointerX = x;
        lastPointerY = y;
        return;
      }

      const dx = x - lastPointerX;
      const dy = y - lastPointerY;
      const dist = Math.hypot(dx, dy);

      if (dist > 28) {
        const direction = dx >= 0 ? 1 : -1;
        triggerSpin(direction);
        lastPointerX = x;
        lastPointerY = y;
      }
    }

    function resetPointerTrack() {
      lastPointerX = null;
      lastPointerY = null;
    }

    async function startExperience() {
      if (animationStarted) return;

      animationStarted = true;
      startedAt = performance.now();

      overlay.classList.add("hidden");

      await requestMotionPermission();

      createHeartParticles();

      setTimeout(() => {
        message.classList.add("show");
      }, 1200);
    }

    overlay.addEventListener("click", startExperience);
    overlay.addEventListener("touchstart", startExperience, { passive: true });

    window.addEventListener("mousemove", (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });

    window.addEventListener("mousedown", (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });

    window.addEventListener("mouseup", resetPointerTrack);
    window.addEventListener("mouseleave", resetPointerTrack);

    window.addEventListener("touchmove", (e) => {
      if (!e.touches || !e.touches[0]) return;
      handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener("touchend", resetPointerTrack);
    window.addEventListener("touchcancel", resetPointerTrack);

    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
